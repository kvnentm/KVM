er no-padd\">\n          <div>\n            <div class=\"div-hide\">\n              <div class=\"nav-tag split-tag\">Who We Are<\/div>\n            <\/div>\n          <\/div>\n          <div id=\"w-node-f795206b-cfea-47c2-42e7-3d1c4abaf737-8b326cb4\">\n            <p class=\"manifesto-static\">We are KVM. Founded in Dublin in 2026, we fly where traditional cameras cannot. Built by a team of skilled FPV pilots, KVM fuses technical precision with creative storytelling \u2014 delivering breathtaking aerial footage for real estate, film, weddings, and tourism across Ireland and beyond.<\/p>\n          <\/div>\n        <\/div>\n        <div class=\"spacer\"><\/div>\n      <\/div>\n      <div class=\"w-layout-grid grid-container no-padd horizontal-text-pin\">\n        <div id=\"w-node-f795206b-cfea-47c2-42e7-3d1c4abaf74e-8b326cb4\" class=\"rel\">\n          <div class=\"subtitle-in-text\">\n            <div class=\"nav-tag split-tag\">Services<\/div>\n          <\/div>\n          <p class=\"manifesto-static\"><span class=\"text-span-2\"> <\/span>From sweeping coastal properties to intimate wedding venues and cinematic film sets, we align creative vision, technical precision, and flight expertise to make every project unforgettable.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div id=\"services\" class=\"horizontal-section\">\n      <div class=\"horizontal-wrapper\">\n        <div class=\"track\">\n          <div class=\"h-slide\">\n            <div class=\"top\">\n              <p class=\"claim-s split-slide\">Seamless aerial fly-throughs<br />for residential homes, commercial<br />offices, workspaces, and open land.<br />Exterior landscapes to interior<br />reveals \u2014 all captured in<br />stunning 4K.<\/p>\n              <div class=\"div-hide\">\n                <div class=\"h-arrow w-embed\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\" fill=\"none\">\n                    <path\n                      d=\"M16.0003 14.1421H11.9895V6.59024L3.14789 15.4319L0.568359 12.8524L9.41002 4.01071H1.85812V0H16.0003L16.0003 14.1421Z\"\n                      fill=\"#B2CBE6\" />\n                  <\/svg><\/div>\n              <\/div>\n            <\/div>\n            <div class=\"bot col clipping-text gap\">\n              <div class=\"nav-tag clipping-text\">Real Estate<\/div>\n              <h2 class=\"clipping-text home-h2\">Fly-Through<\/h2>\n            <\/div>\n          <\/div>\n          <div class=\"h-slide side\">\n            <div class=\"slide-side__content\">\n              <div class=\"nav-tag color-white\">Service<\/div>\n              <div class=\"w-embed\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 58 58\" fill=\"none\"\n                  class=\"svg-draw\">\n                  <path d=\"M1.19006 0.969727C1.19006 31.7697 26.1601 56.7397 56.9601 56.7397\" stroke=\"white\"\n                    stroke-width=\"1\" stroke-miterlimit=\"10\" />\n                  <path d=\"M56.8401 1.0498C26.0401 1.0498 1.07007 26.0198 1.07007 56.8198\" stroke=\"white\"\n                    stroke-width=\"1\" stroke-miterlimit=\"10\" />\n                  <path d=\"M0.940063 56.6997C31.7401 56.6997 56.7101 31.7297 56.7101 0.929688\" stroke=\"white\"\n                    stroke-width=\"1\" stroke-miterlimit=\"10\" />\n                  <path d=\"M56.69 1H1V56.69H56.69V1Z\" stroke=\"white\" stroke-width=\"1.5\" stroke-miterlimit=\"10\" />\n                <\/svg>\n\n                <style>\n                  .svg-draw {\n                    width: 5.556vw !important;\n                    height: 5.556vw !important;\n                  }\n\n                  @media (max-width: 479px) {\n                    .svg-draw {\n                      width: 19.9vw !important;\n                      height: 19.9vw !important;\n                    }\n                  }\n                <\/style>\n              <\/div>\n              <div class=\"nav-tag color-white\">Service<\/div>\n            <\/div>\n          <\/div>\n          <div class=\"h-slide\">\n            <div class=\"top\">\n              <p class=\"claim-s split-slide\">Smooth, stabilised aerial<br />cinematography for films,<br />tourism reels, and commercial<br />productions \u2014 delivered<br />in colorist-friendly ProRes raw,<br />ready for any timeline.<\/p>\n              <div class=\"div-hide\">\n                <div class=\"h-arrow w-embed\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\" fill=\"none\">\n                    <path\n                      d=\"M16.0003 14.1421H11.9895V6.59024L3.14789 15.4319L0.568359 12.8524L9.41002 4.01071H1.85812V0H16.0003L16.0003 14.1421Z\"\n                      fill=\"#B2CBE6\" />\n                  <\/svg><\/div>\n              <\/div>\n            <\/div>\n            <div class=\"bot col clipping-text gap\">\n              <div class=\"nav-tag clipping-text\">Cinematic Production<\/div>\n              <h2 class=\"clipping-text home-h2\">Cinematic<\/h2>\n            <\/div>\n          <\/div>\n          <div class=\"h-slide side\">\n            <div class=\"slide-side__content\">\n              <div class=\"nav-tag color-white\">Service<\/div>\n              <div class=\"w-embed\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 58 58\" fill=\"none\"\n                  class=\"svg-draw\">\n                  <path\n                    d=\"M14.75 56.44C22.3439 56.44 28.5 44.0293 28.5 28.72C28.5 13.4107 22.3439 1 14.75 1C7.15608 1 1 13.4107 1 28.72C1 44.0293 7.15608 56.44 14.75 56.44Z\"\n                    stroke=\"white\" stroke-width=\"0.5\" stroke-miterlimit=\"10\" />\n                  <path\n                    d=\"M28.73 56.44C36.3239 56.44 42.48 44.0293 42.48 28.72C42.48 13.4107 36.3239 1 28.73 1C21.1361 1 14.98 13.4107 14.98 28.72C14.98 44.0293 21.1361 56.44 28.73 56.44Z\"\n                    stroke=\"white\" stroke-width=\"0.5\" stroke-miterlimit=\"10\" />\n                  <path\n                    d=\"M42.72 56.44C50.3139 56.44 56.47 44.0293 56.47 28.72C56.47 13.4107 50.3139 1 42.72 1C35.1261 1 28.97 13.4107 28.97 28.72C28.97 44.0293 35.1261 56.44 42.72 56.44Z\"\n                    stroke=\"white\" stroke-width=\"0.5\" stroke-miterlimit=\"10\" />\n                <\/svg><\/div>\n              <div class=\"nav-tag color-white\">Service<\/div>\n            <\/div>\n          <\/div>\n          <div class=\"h-slide\">\n            <div class=\"top\">\n              <p class=\"claim-s split-slide\">Breathtaking aerial coverage<br />for your most important moments.<br />Dynamic, cinematic shots from<br />above \u2014 turning memories<br />into footage you'll keep<br />forever.<\/p>\n              <div class=\"div-hide\">\n                <div class=\"h-arrow w-embed\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 16 16\" fill=\"none\">\n                    <path\n                      d=\"M16.0003 14.1421H11.9895V6.59024L3.14789 15.4319L0.568359 12.8524L9.41002 4.01071H1.85812V0H16.0003L16.0003 14.1421Z\"\n                      fill=\"#B2CBE6\" />\n                  <\/svg><\/div>\n              <\/div>\n            <\/div>\n            <div class=\"bot col clipping-text gap\">\n              <div class=\"nav-tag clipping-text\">Weddings &amp; Events<\/div>\n              <h2 class=\"clipping-text home-h2\">Capture<\/h2>\n            <\/div>\n          <\/div>\n          <div class=\"h-slide side\">\n            <div class=\"slide-side__content\">\n              <div class=\"nav-tag color-white\">Service<\/div>\n              <div class=\"w-embed\"><svg xmlns=\"http://www.w3.org/2000/svg\" class=\"svg-draw\" viewBox=\"0 0 59 59\"\n                  fill=\"none\">\n                  <path d=\"M28.92 28.92L28.65 56.83H1V1H56.84L57.06 28.9L28.92 28.92Z\" stroke=\"white\" stroke-width=\"1.5\"\n                    stroke-miterlimit=\"10\" />\n                  <path d=\"M56.5042 29.7143L28.9945 2.20459L1.48476 29.7143L28.9945 57.2241L56.5042 29.7143Z\"\n                    stroke=\"white\" stroke-width=\"1.5\" stroke-miterlimit=\"10\" />\n                <\/svg><\/div>\n              <div class=\"nav-tag color-white\">Service<\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div class=\"timeline-horizontal w-embed w-script\">\n        <script>\n          window.addEventListener(\"load\", () => {\n            const section = document.querySelector(\".horizontal-section\");\n            const wrapper = section?.querySelector(\".horizontal-wrapper\");\n            const track = section?.querySelector(\".track\");\n            const textPin = document.querySelector(\".horizontal-text-pin\");\n\n            if (!section || !wrapper || !track) return;\n\n            const isMobile = window.matchMedia(\"(max-width: 479px)\").matches;\n            const slides = gsap.utils.toArray(\".h-slide\");\n            const slideDataList = [];\n\n            // 1) Prepare all slides: split text, prepare SVG paths & arrows\n            slides.forEach((slide, index) => {\n              const targets = slide.querySelectorAll(\".split-slide:not(.home-h2):not(.nav-tag)\");\n              const svgPaths = slide.querySelectorAll(\".svg-draw path\");\n              const arrows = slide.querySelectorAll(\".h-arrow\");\n\n              let lines = [];\n              if (targets.length && typeof SplitText !== \"undefined\") {\n                const splits = [];\n                targets.forEach((el) => {\n                  const split = new SplitText(el, { type: \"lines\", mask: \"lines\" });\n                  splits.push(split);\n                });\n                lines = splits.flatMap((s) => s.lines);\n                gsap.set(lines, { y: \"140%\", opacity: 0 });\n              }\n\n              if (svgPaths.length) {\n                svgPaths.forEach((path) => {\n                  const length = path.getTotalLength();\n                  gsap.set(path, {\n                    stroke: \"#ffffff\",\n                    strokeWidth: 1,\n                    fill: \"none\",\n                    strokeDasharray: length,\n                    strokeDashoffset: length\n                  });\n                });\n              }\n\n              if (arrows.length) {\n                gsap.set(arrows, { yPercent: 150 });\n              }\n\n              slideDataList.push({\n                slide,\n                lines,\n                svgPaths,\n                arrows,\n                isFirst: index === 0,\n                played: false\n              });\n            });\n\n            function playSlideAnim(data) {\n              if (!data || data.played) return;\n              data.played = true;\n\n              if (data.lines && data.lines.length) {\n                gsap.to(data.lines, {\n                  y: \"0%\",\n                  opacity: 1,\n                  duration: 0.7,\n                  ease: \"power3.out\",\n                  stagger: 0.05\n                });\n              }\n\n              if (data.svgPaths && data.svgPaths.length) {\n                gsap.to(data.svgPaths, {\n                  strokeDashoffset: 0,\n                  duration: 1.5,\n                  ease: \"power3.inOut\"\n                });\n              }\n\n              if (data.arrows && data.arrows.length) {\n                gsap.to(data.arrows, {\n                  yPercent: 0,\n                  duration: 0.7,\n                  ease: \"power3.out\"\n                });\n              }\n            }\n\n            // ===================== MOBILE =====================\n            if (isMobile) {\n              gsap.set(wrapper, { scale: 1, x: 0, y: 0 });\n              gsap.set(track, { x: 0 });\n\n              ScrollTrigger.create({\n                trigger: section,\n                start: \"top 80%\",\n                once: true,\n                onEnter: () => {\n                  slideDataList.forEach((data) => playSlideAnim(data));\n                }\n              });\n\n              return;\n            }\n\n            // ===================== DESKTOP =====================\n            const getTotalDistance = () => track.scrollWidth - window.innerWidth;\n\n            gsap.set(wrapper, { scale: 0, x: 0, y: 0 });\n            gsap.set(track, { x: 0 });\n\n            const tl = gsap.timeline({\n              scrollTrigger: {\n                trigger: section,\n                start: \"top top\",\n                end: () => \"+=\" + (getTotalDistance() + window.innerHeight * 0.5),\n                scrub: true,\n                pin: true,\n                anticipatePin: 1,\n                invalidateOnRefresh: true\n              },\n              defaults: { ease: \"none\" }\n            });\n\n            // LABELS\n            tl.addLabel(\"scaleStart\");\n\n            tl.to(wrapper, {\n              scale: 1,\n              x: \"50vw\",\n              duration: 0.3\n            });\n\n            // Slide 1 (Fly-Through) triggers when scale reaches 1\n            tl.call(() => playSlideAnim(slideDataList[0]), null, \">\");\n\n            tl.addLabel(\"scaleEnd\");\n\n            tl.to(wrapper, {\n              x: \"0vw\",\n              duration: 0.2\n            });\n\n            tl.to(track, {\n              x: () => -getTotalDistance(),\n              duration: 0.5\n            });\n\n            tl.to({}, { duration: 0.15 });\n\n            // Observer for subsequent slides (Card 2, Card 3, dividers)\n            const observer = new IntersectionObserver(\n              (entries) => {\n                entries.forEach((entry) => {\n                  if (!entry.isIntersecting || entry.intersectionRatio < 0.5) return;\n                  const data = slideDataList.find((d) => d.slide === entry.target);\n                  if (data && !data.isFirst) {\n                    playSlideAnim(data);\n                    observer.unobserve(entry.target);\n                  }\n                });\n              },\n              {\n                threshold: [0.5]\n              }\n            );\n\n            slideDataList.forEach((data) => {\n              if (!data.isFirst) observer.observe(data.slide);\n            });\n\n            // ===================== PIN TEXTE (70% DU SCALE) =====================\n            if (textPin) {\n              ScrollTrigger.create({\n                trigger: section,\n                start: \"top 20%\",\n                end: () => {\n                  const st = tl.scrollTrigger;\n                  const scaleStart = st.start + tl.labels.scaleStart * (st.end - st.start);\n                  const scaleEnd = st.start + tl.labels.scaleEnd * (st.end - st.start);\n\n                  const scaleDuration = scaleEnd - scaleStart;\n                  return scaleStart + scaleDuration * 0.7; // \u2b05\ufe0f 30% plus court\n                },\n                pin: textPin,\n                pinSpacing: false,\n                scrub: true,\n                anticipatePin: 1\n              });\n            }\n          });\n        <\/script>\n      <\/div>\n    <\/div>\n    <div class=\"last-section bg-white\">\n      <div class=\"w-layout-grid grid-container\">\n        <div id=\"w-node-f795206b-cfea-47c2-42e7-3d1c4abaf7b3-8b326cb4\" class=\"section__intro-text\">\n          <div class=\"nav-tag color-black split-tag\">Our Identity<\/div>\n          <p class=\"manifesto-static clipping-text\">We fly where traditional cameras cannot.<br />Built for the impossible shot, and absolute availability.<\/p>\n        <\/div>\n      <\/div>\n      <div class=\"section-values\">\n        <div class=\"container color-black\">\n          <div class=\"value-list\">\n            <div class=\"value-item top-align\">\n              <div class=\"value-icon color-blue w-embed\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"58\"\n                  height=\"58\" viewBox=\"0 0 58 58\" fill=\"currentColor\">\n                  <path\n                    d=\"M28.7197 0C44.5813 0 57.4403 12.8582 57.4404 28.7197C57.4404 44.5813 44.5813 57.4404 28.7197 57.4404C12.8584 57.4402 6.5975e-05 44.5811 0 28.7197C0.000147413 12.8584 12.8584 0.000263891 28.7197 0ZM2.02051 29.7207C2.53478 43.6819 13.7585 54.9049 27.7197 55.4189V29.7207H2.02051ZM29.7197 55.4189C44.0135 54.8931 55.4404 43.1419 55.4404 28.7197C55.4403 14.2976 44.0134 2.54536 29.7197 2.01953V55.4189ZM27.7197 2.01953C13.7578 2.5335 2.53382 13.7586 2.02051 27.7207H27.7197V2.01953Z\"\n                    fill=\"#B2CBE6\" />\n                <\/svg><\/div>\n              <div class=\"value-text\">\n                <h4>Technical Precision,<br />Creative Vision<\/h4>\n                <p>Every flight is meticulously planned. Our pilots act as an extension of the camera operator's eye \u2014 each frame considered, each trajectory purpose-built for the shot.<\/p>\n              <\/div>\n              <div class=\"value-item__line top\"><\/div>\n              <div class=\"value-item__line bot\"><\/div>\n            <\/div>\n            <div class=\"value-divider\"><\/div>\n            <div class=\"value-item top-align\">\n              <div class=\"value-icon color-blue w-embed\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"58\"\n                  height=\"57\" viewBox=\"0 0 58 57\" fill=\"none\">\n                  <path\n                    d=\"M57.4502 56.8203H0V0H57.4502V56.8203ZM55.4502 28.7324C41.3566 29.2843 30.0444 40.689 29.6416 54.8203H55.4502V28.7324ZM27.8945 11.7305C23.74 22.0935 13.7552 29.4912 2 29.8633V54.8203H27.6348L27.8945 11.7305ZM29.6943 44.8613C33.8319 34.5384 43.7549 27.1556 55.4502 26.7295V2H29.9541L29.6943 44.8613ZM2 27.8613C16.0818 27.3823 27.4195 16.0714 27.9395 2H2V27.8613Z\"\n                    fill=\"#B2CBE6\" />\n                <\/svg><\/div>\n              <div class=\"value-text\">\n                <h4>Cinematic<br />Excellence<\/h4>\n                <p>We deliver colorist-friendly ProRes raw footage, gimbal-stabilised cinematic reveals, and ultra-low flying sweeps \u2014 ready for your professional master pdate, { passive: true });\n    window.addEventListener('resize', update, { passive: true });\n    window.addEventListener('load', update);\n    reducedMotion.addEventListener('change', update);\n    update();\n  }\n\n  function initHeroCursor() {\n    const root = document.querySelector('.button-big');\n    const hero = document.querySelector('.home-hero');\n    const nav = document.querySelector('.navigation');\n    if (!root || !hero) return;\n    gsap.set(root, { scale: 0, pointerEvents: 'none' });\n    if (!matchMedia('(hover: hover) and (pointer: fine)').matches || reducedMotion.matches) return;\n    const setX = gsap.quickTo(root, 'x', { duration: 0.3, ease: 'power3.out' });\n    const setY = gsap.quickTo(root, 'y', { duration: 0.3, ease: 'power3.out' });\n    let visible = false;\n    let overNav = false;\n    let active = false;\n    let ready = false;\n    setTimeout(() => { ready = true; }, 1000);\n    const eligible = () => ready && visible && !overNav && !document.hidden && !reducedMotion.matches;\n    function setActive(next) {\n      if (active === next) return;\n      active = next;\n      hero.classList.toggle('cursor-replaced', next);\n      gsap.to(root, { scale: next ? 1 : 0, duration: next ? 0.5 : 0.4, ease: 'quart.out', overwrite: 'auto' });\n    }\n    new IntersectionObserver(entries => {\n      visible = entries[0].intersectionRatio >= 0.5;\n      if (!eligible()) setActive(false);\n    }, { threshold: [0, 0.5] }).observe(hero);\n    const move = frameTask(event => {\n      if (!eligible()) return setActive(false);\n      setX(event.clientX);\n      setY(event.clientY);\n      setActive(true);\n    });\n    window.addEventListener('pointermove', event => {\n      if (eligible()) move(event);\n      else setActive(false);\n    }, { passive: true });\n    nav?.addEventListener('mouseenter', () => { overNav = true; setActive(false); });\n    nav?.addEventListener('mouseleave', () => { overNav = false; });\n    document.addEventListener('mousele * Quand il est ouvert */\n.nav--dropdown.is-open {\n  opacity: 1;\n  pointer-events: auto;\n}\n\n<\/style>\n\n\n\n<script>\ndocument.addEventListener(\"DOMContentLoaded\", () => {\n  // \ud83d\udc47 D\u00e9clare tous les couples trigger / dropdown que tu veux animer\n  const dropdownConfigs = [\n    {\n      triggerSelector: \".nav-link--offre\",\n      dropdownSelector: \".nav-dropdown--offre\",\n    },\n    {\n      triggerSelector: \".nav-link--expertise\",\n      dropdownSelector: \".nav-dropdown--expertise\",\n    }\n  ];\n\n  dropdownConfigs.forEach(({ triggerSelector, dropdownSelector }) => {\n    const trigger  = document.querySelector(triggerSelector);\n    const dropdown = document.querySelector(dropdownSelector);\n\n    if (!trigger || !dropdown) return;\n\n    const items = dropdown.querySelectorAll(\".split-nav\");\n    if (!items.length) return;\n\n    // SplitText sur chaque item\n    const splitInstances = [];\n    items.forEach((el) => {\n      const split = new SplitText(el, {\n        type: \"lines\",\n        mask: \"lines\",\n      });\n      splitInstances.push(split);\n\n      gsap.set(split.lines, {\n        yPercent: 120,\n        opacity: 0,\n      });\n    });\n\n    // Timeline d'apparition du dropdown (uniquement pour Y + texte)\n    const showTl = gsap.timeline({ paused: true })\n      .fromTo(\n        dropdown,\n        { y: 8 },\n        { y: 0, duration: 0.3, ease: \"quart.out\" },\n        0\n      )\n      .to(\n        splitInstances.map((s) => s.lines),\n        {\n          yPercent: 0,\n          opacity: 1,\n          duration: 1,\n          ease: \"quart.out\",\n          stagger: 0.05,\n        },\n        0\n      );\n\n    let hideTimeout;\n\n    function openDropdown() {\n      clearTimeout(hideTimeout);\n      dropdown.classList.add(\"is-open\");   // \ud83d\udd25 d\u00e9clenche le fade CSS\n      showTl.play();\n    }\n\n    function closeDropdown() {\n      hideTimeout = setTimeout(() => {\n        dropdown.classList.remove(\"is-open\");  // \ud83d\udd25 fade-out CSS\n        showTl.reverse();\n      }, 80); // petit d\u00e9lai pour laisser le temps de passer du lien au menu\n    }\n\n    // Hover sur le lien principal\n    trigger.addEventListener(\"mouseenter\", openDropdown);\n    trigger.addEventListener(\"mouseleave\", closeDropdown);\n\n    // Hover sur le dropdown lui-m\u00eame\n    dropdown.addEventListener(\"mouseenter\", () => {\n      clearTimeout(hideTimeout);\n    });\n\n    dropdown.addEventListener(\"mouseleave\", closeDropdown);\n  });\n});\n<\/script><\/div><\/div><div class=\"nav--dropdown nav-dropdown--expertise\"><div class=\"w-dyn-list\"><div role=\"list\" class=\"nav-list w-dyn-items\"><div role=\"listitem\" class=\"w-dyn-item\"><a href=\"about.html\" class=\"nav-dropdown__link split-nav nav-link\">Kevin \u2014 Studio Director &amp; Co-Founder<\/a><\/div><div role=\"listitem\" class=\"w-dyn-item\"><a href=\"about.html\" class=\"nav-dropdown__link split-nav nav-link\">Vlad \u2014 FPV Pilot<\/a><\/div><div role=\"listitem\" class=\"w-dyn-item\"><a href=\"about.html\" class=\"nav-dropdown__link split-nav nav-link\">Mark \u2014 FPV Pilot &amp; Co-Founder<\/a><\/div><div role=\"listitem\" class=\"w-dyn-item\"><a href=\"about.html\" class=\"nav-dropdown__link split-nav nav-link\">KVM Academy \u2014 Coming Soon<\/a><\/div><div role=\"listitem\" class=\"w-dyn-item\"><a href=\"about.html\" class=\"nav-dropdown__link split-nav nav-link\">KVM Titan CineLifter v3 \u2014 Heavy-Lift<\/a><\/div><div role=\"listitem\" class=\"w-dyn-item\"><\/div><div role=\"listitem\" class=\"w-dyn-item\"><\/div><div role=\"listitem\" class=\"w-dyn-item\"><\/div><div role=\"listitem\" class=\"w-dyn-item\"><\/div><\/div><\/div><\/div><\/div><div class=\"nav--buttons\"><div class=\"nav--button\"><a href=\"booking.html\" class=\"button-small w-inline-block\"><div class=\"button-small__arrow left\"><div class=\"div-hide\"><div class=\"w-embed\"><svg xmlns=\"http://www.w3.org/2000/svg\" width=\ lateX(0);\n}\n\n.button-small.is-footer-variant:hover .button-small__arrow.left {\n  transform: translateX(0) scale(1);\n}\n\n.button-small.is-footer-variant:hover .button-small__arrow.right {\n  transform: translateX(0) scale(0);\n}\n<\/style><\/div><\/a><div class=\"w-embed w-script\"><style>\nbody.no-scroll {\n  overflow: hidden;\n  height: 100%;\n  touch-action: none;\n}\n\n\nbody.no-scroll .nav-mobile-panel,\nbody.no-scroll .nav-mobile__submenu {\n  overscroll-behavior: contain;\n}\n\n.w-locales-list a.w--current {\n  display: none !important;\n}\n.navigation {\n  transform: translateY(-110%);\n  transition: transform 0.4s ease;\n}\n\n.navigation.is-ready {\n  transform: translateY(0);\n}\n\n.with-logo .nav--logo {\n  opacity: 0;\n  transition: opacity 0.25s ease;\n}\n.navigation.is-on-white .nav--item:hover::before { background: rgba(204, 229, 255, 0.35); }\n.navigation.is-on-white .nav--dropdown { background: rgba(204, 229, 255, 0.35); }\n\n<\/style>\n\n\n<script>\ndocument.addEventListener(\"DOMContentLoaded\", () => {\n  const nav = document.querySelector(\".navigation\");\n  if (!nav) return;\n\n  const navLinks          = document.querySelectorAll(\".nav-link\");\n  const whiteSections     = document.querySelectorAll(\".bg-white\");\n  const footer            = document.querySelector(\".footer\");\n  const followSection     = document.querySelector(\".home-hero\");\n  const horizontalSection = document.querySelector(\".horizontal-section\");\n\n  const btnCenters = document.querySelectorAll(\".navigation .button-small__center\");\n  const btnArrows  = document.querySelectorAll(\".navigation .button-small__arrow\");\n  const btnBlocks  = [...btnCenters, ...btnArrows];\n\n  const logoSvgs = document.querySelectorAll(\".logo svg *\");\n\tconst arrowSvgs = document.querySelectorAll(\".navigation .button-small__arrow svg *\");\n\n  const path = window.location.pathname.replace(/\\/$/, \"\"); // enl\u00e8ve le trailing slash\n\tconst isHome = path === \"\" || path === \"/\" || path === \"/fr\" || path === \"/en\";\n  const isOffresDesign = path.includes(\"offres-design\");\n\n  // \u2705 CONDITION AJOUT\u00c9E : sur ces pages, la nav ne doit JAMAIS passer en noir\n  const isContactPage = path === \"/fr/contactez-nous\" || path === \"/en/contactez-nous\";\n\n  let lastScroll       = 0;\n  const scrollThreshold = 10;\n  const navHeight      = nav.offsetHeight;\n  let navHidden        = false;\n\n  // ========== UTILS VISIBILIT\u00c9 ==========\n  const isVisible = (el, offsetPx = 0) => {\n    if (!el) return false;\n    const rect = el.getBoundingClientRect();\n    return rect.top < window.innerHeight && rect.bottom > offsetPx;\n  };\n\n  // ========== ANIM D'ENTR\u00c9E NAV ==========\n  requestAnimationFrame(() => {\n    nav.classList.add(\"is-ready\");\n  });\n\n  if (isHome) {\n    nav.classList.add(\"with-logo\");\n  } else {\n    nav.classList.remove(\"with-logo\");\n  }\n\n  // ========== COULEURS NAV ==========\n  const updateNavColors = SiteMotion.createNavColors({\n                nav, navLinks, whiteSections, footer, btnBlocks, logoSvgs, arrowSvgs,\n                ignoreWhite: isContactPage\n              });\n\n  // ========== SCROLL (hide/show) ==========\n  window.addEventListener(\"scroll\", SiteMotion.frameTask(() => {\n    if (nav.classList.contains(\"menu-open\")) return;\n\n    const currentScroll   = window.pageYOffset || document.documentElement.scrollTop;\n    const inFollowSection = isVisible(followSection, window.innerHeight * 0.1);\n    const inHorizontal    = isOffresDesign && isVisible(horizontalSection, 0);\n\n    if (inHorizontal) {\n      nav.style.transform = \"translateY(-100%)\";\n      navHidden = true;\n    } else if (!inFollowSection) {\n      if (Math.abs(currentScroll - lastScroll) > scrollThreshold) {\n        if (currentScroll > lastScroll && currentScroll > 100) {\n          nav.style.transform = \"translateY(-100%)\";\n          navHidden = true;\n        } else {\n          nav.style.transform = \"translateY(0)\";\n          navHidden = false;\n\n          if (isHome) {\n            if (currentScroll > window.innerHeight) {\n              nav.classList.remove(\"with-logo\");\n            } else {\n              nav.classList.add(\"with-logo\");\n            }\n          }\n        }\n        lastScroll = currentScroll;\n      }\n    } else {\n      nav.style.transform = \"translateY(0)\";\n      navHidden = false;\n      if (isHome) nav.classList.add(\"with-logo\");\n    }\n\n    updateNavColors();\n              }), { passive: true });\n\n  // ========== REVEAL \u00c0 LA SOURIS (DESKTOP) ==========\n  window.addEventListener(\"mousemove\", (e) => {\n    const inHorizontal = isOffresDesign && isVisible(horizontalSection, 0);\n    if (inHorizontal) return;\n\n    if (nav.classList.contains(\"menu-open\")) return;\n\n    if (e.clientY < 40 && navHidden) {\n      nav.style.transform = \"translateY(0)\";\n      navHidden = false;\n\n      if (isHome) {\n        nav.classList.remove(\"with-logo\");\n      }\n    }\n  });\n\n \n  setTimeout(updateNavColors, 50);\n\n  // ========== BURGER + PANEL MOBILE ==========\n  const burger = document.querySelector(\".nav-burger\");\n  const panel  = document.querySelector(\".nav-mobile-panel\");\n\n  const mobileLinks      = document.querySelectorAll(\".nav-mobile__link\");\n  const subMobileLinks   = document.querySelectorAll(\".nav-submobile__link\");\n  let mobileSplit = null;\n  let subMobileSplit = null;\n\n  if (typeof SplitText !== \"undefined\") {\n    if (mobileLinks.length) {\n      mobileSplit = new SplitText(mobileLinks, {\n        type: \"lines\",\n        mask: \"lines\"\n      });\n      gsap.set(mobileSplit.lines, { yPercent: 100, opacity: 1 });\n    }\n    if (subMobileLinks.length) {\n      subMobileSplit = new SplitText(subMobileLinks, {\n        type: \"lines\",\n        mask: \"lines\"\n      });\n      gsap.set(subMobileSplit.lines, { yPercent: 100, opacity: 1 });\n    }\n  }\n\n  function animateMobileLinksIn() {\n    if (!mobileSplit) return;\n    gsap.to(mobileSplit.lines, {\n      yPercent: 0,\n      duration: 0.6,\n      ease: \"power3.out\",\n      stagger: 0.05,\n      delay: 0.6\n    });\n  }\n\n  function animateMobileLinksOut() {\n    if (!mobileSplit) return;\n    gsap.to(mobileSplit.lines, {\n      yPercent: 100,\n      duration: 0.4,\n      ease: \"power3.in\"\n    });\n  }\n\n  function animateSubmenuLinksIn(submenu) {\n    if (!subMobileSplit) return;\n    const links = submenu.querySelectorAll(\".nav-submobile__link\");\n    if (!links.length) return;\n\n    const lines = [];\n    links.forEach(link => {\n      subMobileSplit.lines.forEach(line => {\n        if (line.closest(\".nav-submobile__link\") === link) {\n          lines.push(line);\n        }\n      });\n    });\n\n    gsap.set(lines, { yPercent: 100 });\n    gsap.to(lines, {\n      yPercent: 0,\n      duration: 0.6,\n      ease: \"power3.out\",\n      stagger: 0.05,\n      delay: 0.5\n    });\n  }\n\n  function animateSubmenuLinksOut(submenu) {\n    if (!subMobileSplit) return;\n    const links = submenu.querySelectorAll(\".nav-submobile__link\");\n    if (!links.length) return;\n\n    const lines = [];\n    links.forEach(link => {\n      subMobileSplit.lines.forEach(line => {\n        if (line.closest(\".nav-submobile__link\") === link) {\n          lines.push(line);\n        }\n      });\n    });\n\n    gsap.to(lines, {\n      yPercent: 100,\n      duration: 0.3,\n      ease: \"power3.in\"\n    });\n  }\n\n  // ========== SOUS-MENUS MOBILE (OFFRES / EXPERTISE) ==========\n  const subMenuOffres    = document.querySelector(\".nav-mobile__submenu.nav-mobile__submenu-offres\");\n  const subMenuExpertise = document.querySelector(\".nav-mobile__submenu.nav-mobile__submenu-expertise\");\n  const subMenus         = [subMenuOffres, subMenuExpertise].filter(Boolean);\n\n  function openSubMenu(sub) {\n    if (!sub) return;\n\n    \n    subMenus.forEach(s => {\n      if (s !== sub) {\n        s.classList.remove(\"is-open\");\n        animateSubmenuLinksOut(s);\n      }\n    });\n\n    if (panel) {\n      panel.classList.add(\"has-submenu-open\");\n    }\n\n    sub.classList.add(\"is-open\");\n    animateSubmenuLinksIn(sub);\n  }\n\n  function closeSubMenu(sub) {\n    if (!sub) return;\n    sub.classList.remove(\"is-open\");\n    animateSubmenuLinksOut(sub);\n    if (panel) {\n      panel.classList.remove(\"has-submenu-open\");\n    }\n  }\n\n  if (burger && panel) {\n    const svg = burger.querySelector(\"svg\");\n\n    const bottomPolyline = svg ? svg.querySelector(\"#globalnav-menutrigger-bread-bottom\") : null;\n    const topPolyline    = svg ? svg.querySelector(\"#globalnav-menutrigger-bread-top\") : null;\n\n    let bottomOpen, bottomClose, topOpen, topClose;\n\n    if (bottomPolyline) {\n      const anims = bottomPolyline.querySelectorAll(\"animate\");\n      bottomOpen  = anims[0];\n      bottomClose = anims[1];\n    }\n    if (topPolyline) {\n      const anims = topPolyline.querySelectorAll(\"animate\");\n      topOpen  = anims[0];\n      topClose = anims[1];\n    }\n\n    let isOpen = false;\n\n    \n\n    // Menu links navigate directly; close the panel first so same-page\n    // links (e.g. #services on the home page) don't leave it open.\n    panel.querySelectorAll(\".nav-mobile__link\").forEach(link => {\n      link.addEventListener(\"click\", () => {\n        if (panel.classList.contains(\"is-open\")) burger.click();\n      });\n    });\n\n    const submenuBackButtons = document.querySelectorAll(\".nav-mobile__submenu-back\");\n    submenuBackButtons.forEach(btn => {\n      btn.addEventListener(\"click\", (e) => {\n        e.preventDefault();\n        const submenu = btn.closest(\".nav-mobile__submenu\");\n        closeSubMenu(submenu);\n      });\n    });\n\n    burger.addEventListener(\"click\", () => {\n      isOpen = !isOpen;\n\n      panel.classList.toggle(\"is-open\", isOpen);\n      burger.classList.toggle(\"is-open\", isOpen);\n      nav.classList.toggle(\"menu-open\", isOpen);\n\n      document.body.classList.toggle(\"no-scroll\", isOpen);\n\n      if (!isOpen) {\n        subMenus.forEach(sm => {\n          sm.classList.remove(\"is-open\");\n          animateSubmenuLinksOut(sm);\n        });\n        if (panel) {\n          panel.classList.remove(\"has-submenu-open\");\n        }\n        animateMobileLinksOut();\n        updateNavColors();\n      } else {\n        animateMobileLinksIn();\n      }\n\n      if (topOpen && bottomOpen && topClose && bottomClose) {\n        if (isOpen) {\n          topOpen.beginElement();\n          bottomOpen.beginElement();\n        } else {\n          topClose.beginElement();\n          bottomClose.beginElement();\n        }\n      }\n    });\n  }\n});\n<\/script><\/div><\/div><\/div><div class=\"nav-burger\"><div class=\"burger-icon w-embed\"><div class=\"nav-burger\">\n  <svg width=\"18\" height=\"18\" viewBox=\"0 0 18 18\">\n    <polyline id=\"globalnav-menutrigger-bread-bottom\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" points=\"2 12, 16 12\">\n      <animate attributeName=\"points\" keyTimes=\"0;0.5;1\" dur=\"0.24s\" begin=\"indefinite\" fill=\"freeze\" calcMode=\"spline\" keySplines=\"0.42, 0, 1, 1;0, 0, 0.58, 1\" values=\" 2 12, 16 12; 2 9, 16 9; 3.5 15, 15 3.5\"><\/animate>\n      <animate attributeName=\"points\" keyTimes=\"0;0.5;1\" dur=\"0.24s\" begin=\"indefinite\" fill=\"freeze\" calcMode=\"spline\" keySplines=\"0.42, 0, 1, 1;0, 0, 0.58, 1\" values=\" 3.5 15, 15 3.5; 2 9, 16 9; 2 12, 16 12\"><\/animate>\n    <\/polyline>\n    <polyline id=\"globalnav-menutrigger-bread-top\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" points=\"2 5, 16 5\">\n      <animate attributeName=\"points\" keyTimes=\"0;0.5;1\" dur=\"0.24s\" begin=\"indefinite\" fill=\"freeze\" calcMode=\"spline\" keySplines=\"0.42, 0, 1, 1;0, 0, 0.58, ument.addEventListener('visibilitychange', syncScroll);\n  syncScroll();\n\n  const background = document.querySelector('.background[data-us-project]');\n  if (!background) return;\n  let scene;\n  let loading = false;\n  let failed = false;\n\n  function syncBackground() {\n    if (scene) {\n      scene.paused = document.hidden || reducedMotion.matches;\n      return;\n    }\n    if (loading || failed || document.hidden || reducedMotion.matches) return;\n    loading = true;\n    background.id ||= 'ambient-background';\n\n    const initialize = () => {\n      const mobile = matchMedia('(pointer: coarse)').matches;\n      // The existing v1.5.3 SDK supports explicit fps, scale, dpi and pause.\n      // Lower pixel count keeps the soft gradient affordable at high refresh rates.\n      UnicornStudio.addScene({\n        elementId: background.id,\n        projectId: background.dataset.usProject,\n        fps: mobile ? 60 : 120,\n        dpi: 1,\n        scale: mobile ? 0.5 : 0.75,\n        fixed: true,\n        interactivity: { mouse: { disableMobile: true } }\n      }).then(result => {\n        scene = result;\n        loading = false;\n        syncBackground();\n      }).catch(() => { loading = false; failed = true; });\n    };\n\n    if (window.UnicornStudio?.addScene) return initialize();\n    const script = document.createElement('script');\n    script.src = 'https://cdn.jsdelivr.net/gh/hiunicornstudio/unicornstudio.js@v1.5.3/dist/unicornStudio.umd.js';\n    script.async = true;\n    script.onload = initialize;\n    // The plum CSS gradient remains visible if the external scene cannot load.\n    script.onerror = () => { loading = false; failed = true; };\n    document.head.appendChild(script);\n  }\n  document.addEventListener('visibilitychange', syncBackground);\n  reducedMotion.addEventListener('change', syncBackground);\n  const startBackground = () => {\n    if ('requestIdleCallback' in window) requestIdleCallback(syncBackground, { timeout: 1500 });\n    else setTimeout(syncBackground, 0);\n  };\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', startBackground, { once: true });\n  else startBackground();\n})();\n\n<\/script><script>\nlet incrTick = 0,\n    interactionTimeout,\n    xTo,\n    scaleTo,\n    portfolioObserver,\n    isMobile = window.innerWidth <= 600;\n\nwindow.addEventListener(\"DOMContentLoaded\", () => {\n  const container = document.querySelector('.container-projet');\n  const content   = document.querySelector('.container-projet .content');\n  if(!container || !content) return;\n\n  // 1) Dupliquer les items CMS pour avoir 2 bandes identiques\n  if (!isMobile) duplicateOnce(content);\n\n  // 2) Attendre que toutes les images soient pr\u00eates\n  waitForImages(content).then(() => {\n    const resize = SiteMotion.frameTask(() => {\n      isMobile = window.innerWidth <= 600;\n      if (!isMobile) duplicateOnce(content);\n      init(content);\n    });\n    init(content);\n    window.addEventListener('resize', resize, { passive: true });\n    document.addEventListener('visibilitychange', () => {\n      gsap.ticker.remove(tick);\n      if (!document.hidden && !isMobile) gsap.ticker.add(tick);\n    });\n  });\n});\n\nfunction duplicateOnce(content){\n  const items = Array.from(content.children);\n  // si d\u00e9j\u00e0 dupliqu\u00e9, ne pas re-dupliquer\n  const hasDuplicate = content.dataset.cloned === '1';\n  if(hasDuplicate || items.length === 0) return;\n\n  const frag = document.createDocumentFragment();\n  items.forEach(el => {\n    const clone = el.cloneNode(true);\n    clone.dataset.portfolioClone = 'true';\n    frag.appendChild(clone);\n  });\n  content.appendChild(frag);\n  content.dataset.cloned = '1';\n}\n\nfunction waitForImages(scope){\n  const imgs = Array.from(scope.querySelectorAll('img'));\n  if(imgs.length === 0) return Promise.resolve();\n  return new Promise(res => {\n    let loaded = 0;\n    const done = () => { loaded++; if(loaded >= imgs.length) res(); };\n    imgs.forEach(img => (img.complete ? done() : img.addEventListener('load', done, {once:true})));\n    // s\u00e9curit\u00e9 si erreur\n    imgs.forEach(img => img.addEventListener('error', done, {once:true}));\n  });\n}\n\nfunction init(content){\n  const half = content.scrollWidth / 2;            // largeur d'une moiti\u00e9\n  const wrap = gsap.utils.wrap(-half, 0.0001);     // petite marge anti-\"snap\"\n\n  // Kill anciens tickers/observers pour \u00e9viter les doublons\n  gsap.ticker.remove(tick);\n  portfolioObserver?.kill();\n  xTo?.tween.kill();\n  scaleTo?.tween.kill();\n  if (isMobile) {\n    gsap.set(content, { clearProps: 'transform' });\n    gsap.set('.container-projet', { clearProps: 'transform' });\n    return;\n  }\n\n  xTo = gsap.quickTo(content, \"x\", {\n    duration: 1,\n    ease: 'power4',\n    modifiers: { x: gsap.utils.unitize(wrap) },\n  });\n\n  scaleTo = gsap.quickTo('.container-projet', \"scaleX\", {\n    duration: 0.6,\n    ease: 'power4'\n  });\n\n  // Scroll wheel uniquement (pas de drag)\n  portfolioObserver = ScrollTrigger.observe({\n    target: window,\n    type: \"wheel\",\n    onChange: handleWheel,\n  });\n\n  if (!document.hidden) gsap.ticker.add(tick);\n}\n\nfunction handleWheel(e) {\n  incrTick -= e.deltaY; // molette vers le bas => slide vers la gauche\n\n  if (!isMobile) {\n    const valSc = 1 - gsap.utils.clamp(-0.1, 0.1, e.deltaY / 300);\n    scaleTo(valSc);\n    clearTimeout(interactionTimeout);\n    interactionTimeout = setTimeout(() => scaleTo(1), 66);\n  }\n}\n\nfunction tick(time, dt) {\n  incrTick += dt / -30; // auto d\u00e9filement\n  xTo(incrTick);\n}\n<\/script>\n<script>\nwindow.addEventListener(\"DOMContentLoaded\", () => {\n  // Tous les masks des visuels projets\n  const masks = gsap.utils.toArray(\".projet__img-block\");\n  if (!masks.length) return;\n\n  // \u00c9tat de d\u00e9part\n  gsap.set(masks, {\n    clipPath: \"inset(30%)\",\n    scale: 0\n  });\n\n  // Lancement imm\u00e9diat (sans attendr n\n/* --- Phones (\u2264479px) ------------------------------------------------------ */\n@media screen and (max-width: 479px) {\n  .text-span-2 {\n    padding-left: 0;\n  }\n\n  body {\n    font-size: max(15px, 3.98vw);\n  }\n\n  h4 {\n    font-size: max(17px, 4.478vw);\n  }\n\n  /* Footer credits row: let links wrap instead of running off-screen */\n  .right.right-align {\n    flex-wrap: wrap;\n    justify-content: flex-start;\n    gap: 4px 20px;\n  }\n\n  .nav-tag {\n    font-size: max(12px, 1.99vw);\n  }\n\n  .btn-s {\n    font-size: max(13px, 2.985vw);\n  }\n\n  .claim-s {\n    font-size: max(15px, 3.98vw);\n  }\n\n  .nav-submobile__link {\n    font-size: max(17px, 4.478vw);\n  }\n\n  .submenu-back {\n    font-size: 13px;\n  }\n\n  .svg-back {\n    width: 14px;\n    height: 14px;\n  }\n\n  .nav-mobile__submenu-back {\n    height: auto;\n    min-height: 44px;\n  }\n}\n\n/* --- Touch targets -------------------------------------------------------- */\n@media (pointer: coarse) {\n  /* Grow the hit area without moving the visual layout */\n  .link-block,\n  .contact-val[href],\n  .nav--logo {\n    padding-block: 14px;\n    margin-block: -14px;\n  }\n\n  .nav-submobile__link {\n    display: inline-block;\n    padding-block: 10px;\n  }\n\n  .nav-submobile__list-link {\n    gap: 4px;\n  }\n}\n\n/* The menu's text-clip effect paints the hover duplicates through their\n   overflow mask; hover swaps are not used in the touch menu, so hide them. */\n.nav-mobile-panel .nav-tag.hide,\n.nav-mobile__submenu .nav-tag.hide {\n  visibility: hidden;\n}\n\n<\/style>\n  <script>\n/* Shared animation helpers. Keep layout reads out of pointer/scroll hot paths. */\n(() => {\n  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');\n\n  function frameTask(callback) {\n    let frame = 0;\n    let latestArgs;\n    return (...args) => {\n      latestArgs = args;\n      if (frame) return;\n      frame = requestAnimationFrame(() => {\n        frame = 0;\n        callback(...latestArgs);\n      });\n    };\n  }\n\n  function createNavColors({ nav, navLinks, whiteSections, footer, btnBlocks, logoSvgs, arrowSvgs, ignoreWhite = false }) {\n    const visibleSections = new Set();\n    let footerVisible = false;\n    let previousState;\n    let sectionObserver;\n\n    function apply() {\n      if (nav.classList.contains('menu-open')) return;\n      const onWhite = !ignoreWhite && visibleSections.size > 0 && !footerVisible;\n      if (onWhite === previousState) return;\n      previousState = onWhite;\n      nav.classList.toggle('is-on-white', onWhite);\n      const color = onWhite ? '#000' : '#fff';\n      const tween = { duration: reducedMotion.matches ? 0 : 0.25, ease: 'power2.out', overwrite: 'auto' };\n      gsap.to(navLinks, { ...tween, color });\n      gsap.to(logoSvgs, { ...tween, fill: color });\n      gsap.to(arrowSvgs, { ...tween, fill: color });\n      gsap.to(btnBlocks, { ...tween, backgroundColor: onWhite ? 'rgba(204, 229, 255, 0.35)' : 'rgba(255, 255, 255, 0.1)' });\n    }\n\n    function observeSections() {\n      sectionObserver?.disconnect();\n      visibleSections.clear();\n      const height = Math.min(nav.offsetHeight, innerHeight);\n      // All measurements precede animation writes, and run only on setup/resize.\n      whiteSections.forEach(section => {\n        const rect = section.getBoundingClientRect();\n        if (rect.top <= height && rect.bottom >= 0) visibleSections.add(section);\n      });\n      const footerRect = footer?.getBoundingClientRect();\n      footerVisible = !!footerRect && footerRect.top <= innerHeight && footerRect.bottom >= 0;\n      sectionObserver = new IntersectionObserver(entries => {\n        entries.forEach(entry => {\n          if (entry.isIntersecting) visibleSections.add(entry.target);\n          else visibleSections.delete(entry.target);\n        });\n        apply();\n      }, { rootMargin: `0px 0px -${Math.max(0, innerHeight - height)}px 0px` });\n      if (!ignoreWhite) whiteSections.forEach(section => sectionObserver.observe(section));\n      apply();\n    }\n\n    if (footer) {\n      const footerObserver = new IntersectionObserver(entries => {\n        footerVisible = entries[0].isIntersecting;\n        apply();\n      });\n      footerObserver.observe(footer);\n    }\n    const refresh = frameTask(observeSections);\n    window.addEventListener('resize', refresh, { passive: true });\n    document.fonts?.ready.then(refresh);\n    observeSections();\n    return apply;\n  }\n\n  function initExpertiseCards() {\n    const cards = Array.from(document.querySelectorAll('.about__expertise-container'), card => ({\n      card,\n      mask: card.querySelector('.about__expertise-mask'),\n      paths: Array.from(card.querySelectorAll('.about-expertise__svg svg path, .about-expertise__svg svg line, .about-expertise__svg svg polyline, .about-expertise__svg svg polygon, .about-expertise__svg svg circle, .about-expertise__svg svg rect'), path => ({ path, length: path.getTotalLength() })),\n      progress: -1,\n      clip: -1\n    }));\n    if (!cards.length) return;\n    cards.forEach(({ paths }) => paths.forEach(({ path, length }) => {\n      path.style.strokeDasharray = length;\n      path.style.strokeDashoffset = reducedMotion.matches ? 0 : length;\n    }));\n    const clamp = (value, max = 1) => Math.min(max, Math.max(0, value));\n    const update = frameTask(() => {\n      // Read every card before changing any clip paths or SVG styles.\n      const rects = cards.map(({ card }) => card.getBoundingClientRect());\n      const offset = innerWidth * 0.042;\n      const halfHeight = Math.max(1, innerHeight * 0.5);\n      cards.forEach((entry, i) => {\n        if (i && cards[i - 1].mask) {\n          const previous = cards[i - 1];\n          const clip = clamp(rects[i - 1].bottom - rects[i].top - offset, rects[i - 1].height);\n          if (clip !== previous.clip) {\n            previous.mask.style.clipPath = `inset(0px 0px ${clip}px 0px)`;\n            previous.clip = clip;\n          }\n        }\n        const progress = reducedMotion.matches ? 1 : clamp((innerHeight - rects[i].top) / halfHeight);\n        if (progress === entry.progress) return;\n        entry.progress = progress;\n        entry.paths.forEach(({ path, length }) => { path.style.strokeDashoffset = length * (1 - progress); });\n      });\n    });\n    window.addEventListener('scroll', update, { passive: true });\n    window.addEventListener('resize', update, { passive: true });\n    window.addEventListener('load', update);\n    reducedMotion.addEventListener('change', update);\n    update();\n  }\n\n  function initHeroCursor() {\n    const root = document.querySelector('.button-big');\n    const hero = document.querySelector('.home-hero');\n    const nav = document.querySelector('.navigation');\n    if (!root || !hero) return;\n    gsap.set(root, { scale: 0, pointerEvents: 'none' });\n    if (!matchMedia('(hover: hover) and (pointer: fine)').matches || reducedMotion.matches) return;\n    const setX = gsap.quickTo(root, 'x', { duration: 0.3, ease: 'power3.out' });\n    const setY = gsap.quickTo(root, 'y', { duration: 0.3, ease: 'power3.out' });\n    let visible = false;\n    let overNav = false;\n    let active = false;\n    let ready = false;\n    setTimeout(() => { ready = true; }, 1000);\n    const eligible = () => ready && visible && !overNav && !document.hidden && !reducedMotion.matches;\n    function setActive(next) {\n      if (active === next) return;\n      active = next;\n      hero.classList.toggle('cursor-replaced', next);\n      gsap.to(root, { scale: next ? 1 : 0, duration: next ? 0.5 : 0.4, ease: 'quart.out', overwrite: 'auto' });\n    }\n    new IntersectionObserver(entries => {\n      visible = entries[0].intersectionRatio >= 0.5;\n      if (!eligible()) setActive(false);\n    }, { threshold: [0, 0.5] }).observe(hero);\n    const move = frameTask(event => {\n      if (!eligible()) return setActive(false);\n      setX(event.clientX);\n      setY(event.clientY);\n      setActive(true);\n    });\n    window.addEventListener('pointermove', event => {\n      if (eligible()) move(event);\n      else setActive(false);\n    }, { passive: true });\n    nav?.addEventListener('mouseenter', () => { overNav = true; setActive(false); });\n    nav?.addEventListener('mouseleave', () => { overNav = false; });\n    document.addEventListener('mouseleave', () => setActive(false));\n    document.addEventListener('visibilitychange', () => { if (document.hidden) setActive(false); });\n    reducedMotion.addEventListener('change', () => { if (reducedMotion.matches) setActive(false); });\n    const href = root.getAttribute('href') || root.dataset.href;\n    if (href) hero.addEventListener('click', event => {\n      if (eligible() && !event.target.closest('a, button, input, textarea, select, label')) window.KVMRoute(href);\n    });\n  }\n\n  window.SiteMotion = { frameTask, createNavColors, initExpertiseCards, initHeroCursor };\n})();\n\n<\/script>\n  <link rel=\"preconnect\" href=\"https://unpkg.com\" crossorigin />\n  <link rel=\"preconnect\" href=\"https://d3e54v103j8qbb.cloudfront.net\" crossorigin />\n<\/head>\n\n<body>\n  <!-- Recolor only the animated background; keep its original motion. -->\n  <svg xmlns=\"http://www.w3.org/2000/svg\" width=\"0\" height=\"0\" aria-hidden=\"true\" focusable=\"false\" style=\"position:absolute;pointer-events:none\">\n    <defs>\n      <filter id=\"plum-background\" color-interpolation-filters=\"sRGB\" x=\"0%\" y=\"0%\" width=\"100%\" height=\"100%\">\n        <feColorMatrix type=\"saturate\" values=\"0\" />\n        <feComponentTransfer>\n          <feFuncR type=\"table\" tableValues=\"0.086275 0.352941 0.643137\" />\n          <feFuncG type=\"table\" tableValues=\"0.015686 0.058824 0.258824\" />\n          <feFuncB type=\"table\" tableValues=\"0.023529 0.101961 0.313725\" />\n        <\/feComponentTransfer>\n      <\/filter>\n    <\/defs>\n  <\/svg>\n  <div data-us-project=\"tnAhw4e67 uerySelectorAll(\".split-nav\");\n                if (!items.length) return;\n\n                // SplitText sur chaque item\n                const splitInstances = [];\n                items.forEach((el) => {\n                  const split = new SplitText(el, {\n                    type: \"lines\",\n                    mask: \"lines\",\n                  });\n                  splitInstances.push(split);\n\n                  gsap.set(split.lines, {\n                    yPercent: 120,\n                    opacity: 0,\n                  });\n                });\n\n                // Timeline d'apparition du dropdown (uniquement pour Y + texte)\n                const showTl = gsap.timeline({ paused: true })\n                  .fromTo(\n                    dropdown,\n                    { y: 8 },\n                    { y: 0, duration: 0.3, ease: \"quart.out\" },\n                    0\n                  )\n                  .to(\n                    splitInstances.map((s) => s.lines),\n                    {\n                      yPercent: 0,\n                      opacity: 1,\n                      duration: 1,\n                      ease: \"quart.out\",\n                      stagger: 0.05,\n                    },\n                    0\n                  );\n\n                let hideTimeout;\n\n                function openDropdown() {\n                  clearTimeout(hideTimeout);\n                  dropdown.classList.add(\"is-open\");   // \ud83d\udd25 d\u00e9clenche le fade CSS\n                  showTl.play();\n                }\n\n                function closeDropdown() {\n                  hideTimeout = setTimeout(() => {\n                    dropdown.classList.remove(\"is-open\");  // \ud83d\udd25 fade-out CSS\n                    showTl.reverse();\n                  }, 80); // petit d\u00e9lai pour laisser le temps de passer du lien au menu\n                }\n\n                // Hover sur le lien principal\n                trigger.addEventListener(\"mouse on-small.is-footer-variant:hover .button-small__arrow.left {\n                transform: translateX(0) scale(1);\n              }\n\n              .button-small.is-footer-variant:hover .button-small__arrow.right {\n                transform: translateX(0) scale(0);\n              }\n            <\/style>\n          <\/div>\n        <\/a>\n        <div class=\"w-embed w-script\">\n          <style>\n            body.no-scroll {\n              overflow: hidden;\n              height: 100%;\n              touch-action: none;\n            }\n\n\n            body.no-scroll .nav-mobile-panel,\n            body.no-scroll .nav-mobile__submenu {\n              overscroll-behavior: contain;\n            }\n\n            .w-locales-list a.w--current {\n              display: none !important;\n            }\n\n            .navigation {\n              transform: translateY(-110%);\n              transition: transform 0.4s ease;\n            }\n\n            .navigation.is-ready {\n              transform: translateY(0);\n            }\n\n            .with-logo .nav--logo {\n              opacity: 0;\n              transition: opacity 0.25s ease;\n            }\n\n            .navigation.is-on-white .nav--item:hover::before {\n              background: rgba(204, 229, 255, 0.35);\n            }\n\n            .navigation.is-on-white .nav--dropdown {\n              background: rgba(204, 229, 255, 0.35);\n            }\n          <\/style>\n\n\n          <script>\n            document.addEventListener(\"DOMContentLoaded\", () => {\n              const nav = document.querySelector(\".navigation\");\n              if (!nav) return;\n\n              const navLinks = document.querySelectorAll(\".nav-link\");\n              const whiteSections = document.querySelectorAll(\".bg-white\");\n              const footer = document.querySelector(\".footer\");\n              const followSection = document.querySelector(\".home-hero\");\n              const horizontalSection = document.querySelector(\".horizontal-section\");\n\n              const btnCenters = document.querySelectorAll(\".navigation .button-small__center\");\n              const btnArrows = document.querySelectorAll(\".navigation .button-small__arrow\");\n              const btnBlocks = [...btnCenters, ...btnArrows];\n\n              const logoSvgs = document.querySelectorAll(\".logo svg *\");\n              const arrowSvgs = document.querySelectorAll(\".navigation .button-small__arrow svg *\");\n\n              const path = window.location.pathname.replace(/\\/$/, \"\"); // enl\u00e8ve le trailing slash\n              const isHome = path === \"\" || path === \"/\" || path === \"/fr\" || path === \"/en\";\n              const isOffresDesign = path.includes(\"offres-design\");\n\n              // \u2705 CONDITION AJOUT\u00c9E : sur ces pages, la nav ne doit JAMAIS passer en noir\n              const isContactPage = path === \"/fr/contactez-nous\" || path === \"/en/contactez-nous\";\n\n              let lastScroll = 0;\n              const scrollThreshold = 10;\n              const navHeight = nav.offsetHeight;\n              let navHidden = false;\n\n              // ========== UTILS VISIBILIT\u00c9 ==========\n              const isVisible = (el, offsetPx = 0) => {\n                if (!el) return false;\n                const rect = el.getBoundingClientRect();\n                return rect.top < window.innerHeight && rect.bottom > offsetPx;\n              };\n\n              // ========== ANIM D'ENTR\u00c9E NAV ==========\n              requestAnimationFrame(() => {\n                nav.classList.add(\"is-ready\");\n              });\n\n              if (isHome) {\n                nav.classList.add(\"with-logo\");\n              } else {\n                nav.classList.remove(\"with-logo\");\n              }\n\n              // ========== COULEURS NAV ==========\n              const updateNavColors = SiteMotion.createNavColors({\n                nav, navLinks, whiteSections, footer, btnBlocks, logoSvgs, arrowSvgs,\n                ignoreWhite: isContactPage\n              });\n\n              // ========== SCROLL (hide/show) ==========\n              window.addEventListener(\"scroll\", SiteMotion.frameTask(() => {\n                if (nav.classList.contains(\"menu-open\")) return;\n\n                const currentScroll = window.pageYOffset || document.documentElement.scrollTop;\n                const inFollowSection = isVisible(followSection, window.innerHeight * 0.1);\n                const inHorizontal = isOffresDesign && isVisible(horizontalSection, 0);\n\n                if (inHorizontal) {\n                  nav.style.transform = \"translateY(-100%)\";\n                  navHidden = true;\n                } else if (!inFollowSection) {\n                  if (Math.abs(currentScroll - lastScroll) > scrollThreshold) {\n                    if (currentScroll > lastScroll && currentScroll > 100) {\n                      nav.style.transform = \"translateY(-100%)\";\n                      navHidden = true;\n                    } else {\n                      nav.style.transform = \"translateY(0)\";\n                      navHidden = false;\n\n                      if (isHome) {\n                        if (currentScroll > window.innerHeight) {\n                          nav.classList.remove(\"with-logo\");\n                        } else {\n                          nav.classList.add(\"with-logo\");\n                        }\n                      }\n                    }\n                    lastScroll = currentScroll;\n                  }\n                } else {\n                  nav.style.transform = \"translateY(0)\";\n                  navHidden = false;\n                  if (isHome) nav.classList.add(\"with-logo\");\n                }\n\n                updateNavColors();\n              }), { passive: true });\n\n              // ========== REVEAL \u00c0 LA SOURIS (DESKTOP) ==========\n              window.addEventListener(\"mousemove\", (e) => {\n                const inHorizontal = isOffresDesign && isVisible(horizontalSection, 0);\n                if (inHorizontal) return;\n\n                if (nav.classList.contains(\"menu-open\")) return;\n\n                if (e.clientY < 40 && navHidden) {\n                  nav.style.transform = \"translateY(0)\";\n                  navHidden = false;\n\n                  if (isHome) {\n                    nav.classList.remove(\"with-logo\");\n                  }\n                }\n              });\n\n\n              setTimeout(updateNavColors, 50);\n\n              // ========== BURGER + PANEL MOBILE ==========\n              const burger = document.querySelector(\".nav-burger\");\n              const panel = document.querySelector(\".nav-mobile-panel\");\n\n              const mobileLinks = document.querySelectorAll(\".nav-mobile__link\");\n              const subMobileLinks = document.querySelectorAll(\".nav-submobile__link\");\n              let mobileSplit = null;\n              let subMobileSplit = null;\n\n              if (typeof SplitText !== \"undefined\") {\n                if (mobileLinks.length) {\n                  mobileSplit = new SplitText(mobileLinks, {\n                    type: \"lines\",\n                    mask: \"lines\"\n                  });\n                  gsap.set(mobileSplit.lines, { yPercent: 100, opacity: 1 });\n                }\n                if (subMobileLinks.length) {\n                  subMobileSplit = new SplitText(subMobileLinks, {\n                    type: \"lines\",\n                    mask: \"lines\"\n                  });\n                  gsap.set(subMobileSplit.lines, { yPercent: 100, opacity: 1 });\n                }\n              }\n\n              function animateMobileLinksIn() {\n                if (!mobileSplit) return;\n                gsap.to(mobileSplit.lines, {\n                  yPercent: 0,\n                  duration: 0.6,\n                  ease: \"power3.out\",\n                  stagger: 0.05,\n                  delay: 0.6\n                });\n              }\n\n              function animateMobileLinksOut() {\n                if (!mobileSplit) return;\n                gsap.to(mobileSplit.lines, {\n                  yPercent: 100,\n                  duration: 0.4,\n                  ease: \"power3.in\"\n                });\n              }\n\n              function animateSubmenuLinksIn(submenu) {\n                if (!subMobileSplit) return;\n                const links = submenu.querySelectorAll(\".nav-submobile__link\");\n                if (!links.length) return;\n\n                const lines = [];\n                links.forEach(link => {\n                  subMobileSplit.lines.forEach(line => {\n                    if (line.closest(\".nav-submobile__link\") === link) {\n                      lines.push(line);\n                    }\n                  });\n                });\n\n                gsap.set(lines, { yPercent: 100 });\n                gsap.to(lines, {\n                  yPercent: 0,\n                  duration: 0.6,\n                  ease: \"power3.out\",\n                  stagger: 0.05,\n                  delay: 0.5\n                });\n              }\n\n              function animateSubmenuLinksOut(submenu) {\n                if (!subMobileSplit) return;\n                const links = submenu.querySelectorAll(\".nav-submobile__link\");\n                if (!links.length) return;\n\n                const lines = [];\n                links.forEach(link => {\n                  subMobileSplit.lines.forEach(line => {\n                    if (line.closest(\".nav-submobile__link\") === link) {\n                      lines.push(line);\n                    }\n                  });\n                });\n\n                gsap.to(lines, {\n                  yPercent: 100,\n                  duration: 0.3,\n                  ease: \"power3.in\"\n                });\n              }\n\n              // ========== SOUS-MENUS MOBILE (OFFRES / EXPERTISE) ==========\n              const subMenuOffres = document.querySelector(\".nav-mobile__submenu.nav-mobile__submenu-offres\");\n              const subMenuExpertise = document.querySelector(\".nav-mobile__submenu.nav-mobile__submenu-expertise\");\n              const subMenus = [subMenuOffres, subMenuExpertise].filter(Boolean);\n\n              function openSubMenu(sub) {\n                if (!sub) return;\n\n\n                subMenus.forEach(s => {\n                  if (s !== sub) {\n                    s.classList.remove(\"is-open\");\n                    animateSubmenuLinksOut(s);\n                  }\n                });\n\n                if (panel) {\n                  panel.classList.add(\"has-submenu-open\");\n                }\n\n                sub.classList.add(\"is-open\");\n                animateSubmenuLinksIn(sub);\n              }\n\n              function closeSubMenu(sub) {\n                if (!sub) return;\n                sub.classList.remove(\"is-open\");\n                animateSubmenuLinksOut(sub);\n                if (panel) {\n                  panel.classList.remove(\"has-submenu-open\");\n                }\n              }\n\n              if (burger && panel) {\n                const svg = burger.querySelector(\"svg\");\n\n                const bottomPolyline = svg ? svg.querySelector(\"#globalnav-menutrigger-bread-bottom\") : null;\n                const topPolyline = svg ? svg.querySelector(\"#globalnav-menutrigger-bread-top\") : null;\n\n                let bottomOpen, bottomClose, topOpen, topClose;\n\n                if (bottomPolyline) {\n                  const anims = bottomPolyline.querySelectorAll(\"animate\");\n                  bottomOpen = anims[0];\n                  bottomClose = anims[1];\n                }\n                if (topPolyline) {\n                  const anims = topPolyline.querySelectorAll(\"animate\");\n                  topOpen = anims[0];\n                  topClose = anims[1];\n                }\n\n                let isOpen = false;\n\n\n\n                // Menu links navigate directly; close the panel first so same-page\n                // links (e.g. #services on the home page) don't leave it open.\n                panel.querySelectorAll(\".nav-mobile__link\").forEach(link => {\n                  link.addEventListener(\"click\", () => {\n                    if (panel.classList.contains(\"is-open\")) burger.click();\n                  });\n                });\n\n                const submenuBackButtons = document.querySelectorAll(\".nav-mobile__submenu-back\");\n                submenuBackButtons.forEach(btn => {\n                  btn.addEventListener(\"click\", (e) => {\n                    e.preventDefault();\n                    const submenu = btn.closest(\".nav-mobile__submenu\");\n                    closeSubMenu(submenu);\n                  });\n                });\n\n                burger.addEventListener(\"click\", () => {\n                  isOpen = !isOpen;\n\n                  panel.classList.toggle(\"is-open\", isOpen);\n                  burger.classList.toggle(\"is-open\", isOpen);\n                  nav.classList.toggle(\"menu-open\", isOpen);\n\n                  document.body.classList.toggle(\"no-scroll\", isOpen);\n\n                  if (!isOpen) {\n                    subMenus.forEach(sm => {\n                      sm.classList.remove(\"is-open\");\n                      animateSubmenuLinksOut(sm);\n                    });\n                    if (panel) {\n                      panel.classList.remove(\"has-submenu-open\");\n                    }\n                    animateMobileLinksOut();\n                    updateNavColors();\n                  } else {\n                    animateMobileLinksIn();\n                  }\n\n                  if (topOpen && bottomOpen && topClose && bottomClose) {\n                    if (isOpen) {\n                      topOpen.beginElement();\n                      bottomOpen.beginElement();\n                    } else {\n                      topClose.beginElement();\n                      bottomClose.beginElement();\n                    }\n                  }\n                });\n              }\n            });\n          <\/script>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"nav-burger\">\n      <div class=\"burger-icon w-embed\">\n        <div class=\"nav-burger\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 18 18\">\n            <polyline id=\"globalnav-menutrigger-bread-bottom\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"\n              stroke-linecap=\"round\" stroke-linejoin=\"round\" points=\"2 12, 16 12\">\n              <animate attributeName=\"points\" keyTimes=\"0;0.5;1\" dur=\"0.24s\" begin=\"indefinite\" fill=\"freeze\"\n                calcMode=\"spline\" keySplines=\"0.42, 0, 1, 1;0, 0, 0.58, 1\"\n                values=\" 2 12, 16 12; 2 9, 16 9; 3.5 15, 15 3.5\"><\/animate>\n              <animate attributeName=\"points\" keyTimes=\"0;0.5;1\" dur=\"0.24s\" begin=\"indefinite\" fill=\"freeze\"\n                calcMode=\"spline\" keySplines=\"0.42, 0, 1, 1;0, 0, 0.58, 1\"\n                values=\" 3.5 15, 15 3.5; 2 9, 16 9; 2 12, 16 12\"><\/animate>\n            <\/polyline>\n            <polyline id=\"globalnav-menutrigger-bread-top\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"\n              stroke-linecap=\"round\" stroke-linejoin=\"round\" points=\"2 5, 16 5\">\n              <animate attributeName=\"points\" keyTimes=\"0;0.5;1\" dur=\"0.24s\" begin=\"indefinite\" fill=\"freeze\"\n                calcMode=\"spline\" keySplines=\"0.42, 0, 1, 1;0, 0, 0.58, 1\"\n                values=\" 2 5, 16 5; 2 9, 16 9; 3.5 3.5, 15 15\"><\/animate>\n              <animate attributeName=\"points\" keyTimes=\"0;0.5;1\" dur=\"0.24s\" begin=\"indefinite\" fill=\"freeze\"\n                calcMode=\"spline\" keySplines=\"0.42, 0, 1, 1;0, 0, 0.58, 1\"\n                values=\" 3.5 3.5, 15 15      href=\"https://www.linkedin.com/company/kvmirl/home/\" class=\"link-block w-inline-block\" target=\"_blank\" rel=\"noopener\">\n                <div class=\"div-hide\">\n                  <div class=\"nav-tag color-white\">Linkedin<\/div>\n                  <div class=\"nav-tag hide color-white\">Linkedin<\/div>\n                <\/div>\n              <\/a><a data-w-id=\"2cae2378-55e7-6dea-3b5b-c810eb5a631a\"\n                href=\"https://www.instagram.com/kvm.ie/\" class=\"link-block w-inline-block\" target=\"_blank\" rel=\"noopener\">\n                <div class=\"div-hide\">\n                  <div class=\"nav-tag color-white\">Instagram<\/div>\n                  <div class=\"nav-tag hide color-white\">Instagram<\/div>\n                <\/div>\n              <\/a><a data-w-id=\"2cae2378-55e7-6dea-3b5b-c810eb5a6320\" href=\"mailto:Hello@KVM.fr\"\n                class=\"link-block w-inline-block\">\n                <div class=\"div-hide\">\n                  <div class=\"nav-tag color-white\">Hello@KVM.fr<\/div>\n                  <div class=\"nav-tag hide color-white\">Hello@KVM.fr<br /><\/div>\n                <\/div>\n              <\/a><\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <section class=\"about-home\">\n    <div class=\"container\">\n      <div class=\"about-title\">\n        <div class=\"nav-tag load-split\">Our Mission<\/div>\n        <h1 class=\"marquee__text no-upp\">We fly where traditional cameras cannot. Built by a team of skilled FPV pilots, based in Dublin, Ireland.\n        <\/h1>\n      <\/div>\n    <\/div>\n    <div class=\"container\">\n      <div class=\"h-line\"><\/div>\n      <div class=\"w-layout-grid grid-container no-pad-top no-padd no-grid\">\n        <p id=\"w-node-_1465f352-8dd7-b1d0-d390-e117735b3de2-ca4d2c39\"\n          class=\"claim-s align-center marg-top expertise-split\">Every flight is a mission.<br />We partner with\n          homeowners, developers, production studios, <br />event planners, and tourism boards to deliver impossible aerial shots <br />with\n          technical precision and creative vision. <br /><br />Founded in 2026, KVM deploys the right\n          drone, <br />the right pilot, and the right camera system \u2014 tailored to each project's unique cinematic requirements.<\/p>\n      <\/div>\n    <\/div>\n  <\/section>\n  <div class=\"bg-white\">\n    <div class=\"w-layout-grid grid-container\">\n      <div id=\"w-node-_4e058f7f-dee6-6d29-6bc8-099482e65d68-ca4d2c39\" class=\"section__intro-text\">\n        <div class=\"nav-tag color-black split-tag\">Our Crew<\/div>\n        <p class=\"manifesto-static clipping-text\">A human-scale studio with absolute availability \u2014 every flight meticulously\n          planned, every frame hand-built by our close-knit team.<\/p>\n      <\/div>\n      <div id=\"w-node-_1b2354f1-1adc-e788-6d6a-d48419e77dda-ca4d2c39\" class=\"about-grid__content\">\n        <div id=\"w-node-_4466da10-d8b8-97b2-73dd-95e014f3bbe6-ca4d2c39\" class=\"about__img-container\">\n          <div class=\"about__img-mask\"><div class=\"about-img image-placeholder\" role=\"img\" aria-label=\"Image placeholder\"><\/div><\/div>\n        <\/div>\n        <div class=\"color-black w-richtext\">\n          <p class=\"expertise-split\"><strong>KVM was co-founded by Kevin and Mark.<\/strong><\/p>\n          <p class=\"expertise-split\"><strong>Kevin \u2014 Studio Director and Co-Founder.<\/strong><\/p>\n          <p><\/p>\n          <p class=\"expertise-split\">Kevin runs the studio from first contact to final delivery \u2014<\/p>\n          <p class=\"expertise-split\">managing client relationships, creative direction,<\/p>\n          <p class=\"expertise-split\">project logistics, and the crew.<\/p>\n          <p><\/p>\n          <p class=\"expertise-split\">Kevin and Mark co-founded KVM to bring world-class FPV aerial<\/p>\n          <p class=\"expertise-split\">cinematography to Ireland's property, film, and events markets.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"center-text\">\n      <div class=\"h-line color-blue\"><\/div>\n      <p class=\"manifesto-static clipping-text about-p\">A tight-knit crew who share the same values and methods \u2014 forming\n        an ultra-efficient flight team built to capture the shots no one else can.<\/p>\n    <\/div>\n    <div class=\"section-values\">\n      <div class=\"container color-black\">\n        <div class=\"value-list\">\n          <div class=\"value-item top-align\">\n            <div class=\"value-img__cont\">\n              <div class=\"value-img__mask\"><div class=\"value-img image-placeholder\" role=\"img\" aria-label=\"Image placeholder\"><\/div><\/div>\n            <\/div>\n            <div class=\"value-text\">\n              <div class=\"value-heading\">\n                <h4>Vlad<\/h4>\n                <div class=\"nav-tag\">FPV Pilot<\/div>\n              <\/div>\n              <p>Vlad specialises in precision flight for real estate fly-throughs and cinematic productions. Known for buttery-smooth control and technical consistency, he delivers clean aerial sequences that slot directly into any professional timeline \u2014 first take or fifth, the result is always the same: exceptional.<\/p>\n            <\/div>\n            <div class=\"value-item__line top\"><\/div>\n            <div class=\"value-item__line bot\"><\/div>\n          <\/div>\n          <div class=\"value-divider\"><\/div>\n          <div class=\"value-item top-align\">\n            <div class=\"value-img__cont\">\n              <div class=\"value-img__mask\"><div class=\"value-img image-placeholder\" role=\"img\" aria-label=\"Image placeholder\"><\/div><\/div>\n            <\/div>\n            <div class=\"value-text\">\n              <div class=\"value-heading\">\n                <h4>Mark<\/h4>\n                <div class=\"nav-tag\">FPV Pilot &amp; Co-Founder<\/div>\n              <\/div>\n              <p>Mark brings energy, adaptability, and creativity to every mission. Whether he's surveying open land in County Meath or capturing a high-speed chase sequence for a film shoot, Mark balances precision flight with a creative flair that always finds the best frame.<\/p>\n            <\/div>\n            <div class=\"value-item__line top\"><\/div>\n            <div class=\"value-item__line bot\"><\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"about__expertise-section\">\n    <div class=\"about__expertise-container\">\n      <div class=\"about__expertise-mask\">\n        <div class=\"h-line color-blue\"><\/div>\n        <div class=\"about-expertise__content\">\n          <div class=\"about-expertise__svg w-embed\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 217 217\"\n              fill=\"none\">\n              <path d=\"M216.25 0.75V108.189L108.189 216.25H0.75V0.75H216.25Z\" stroke=\"#B2CBE6\" stroke-width=\"1.5\" />\n              <rect x=\"1.06066\" y=\"108.5\" width=\"151.942\" height=\"151.942\" transform=\"rotate(-45 1.06066 108.5)\"\n                stroke=\"#B2CBE6\" stroke-width=\"1.5\" />\n              <path d=\"M108.701 214.678L107.392 107.388L214.682 108.696L108.701 214.678Z\" stroke=\"#B2CBE6\"\n                stroke-width=\"1.5\" />\n            <\/svg>\n\n            <style>\n              .about-expertise__svg {\n                width: 15.069vw;\n                /* ex: 217px sur un \u00e9cran ~1600px */\n                height: auto;\n                /* conserve le ratio */\n                max-width: 217px;\n                /* s\u00e9curit\u00e9 */\n              }\n\n              @media (max-width: 479px) {\n                .about-expertise__svg {\n                  width: 30vw;\n                  max-width: 160px;\n                }\n              }\n            <\/style>\n          <\/div>\n          <div class=\"about-expertise__text-cont\">\n            <div class=\"about-expertise__title\">\n              <h5>We Fly<br />the Impossible<\/h5>\n              <p class=\"claim-s\">Creative vision + technical precision: every flight meticulously planned, every\n                frame hand-built by skilled FPV pilots.<\/p>\n            <\/div>\n            <p class=\"about-expertise__text\">KVM acts as an extension of your creative vision. We plan every\n              trajectory, coordinate closely with your team, and ensure each shot captures the angle no other camera can reach \u2014 whether that's the interior of a Dublin townhouse or a hillside in the Wicklow Mountains.<\/p>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"about__expertise-container\">\n      <div class=\"about__expertise-mask\">\n        <div class=\"h-line color-blue\"><\/div>\n        <div class=\"about-expertise__content\">\n          <div class=\"about-expertise__svg w-embed\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 218 214\"\n              fill=\"none\">\n              <path d=\"M0.750003 0.750061L0.75 212.739L216.495 212.739L216.495 0.750064L0.750003 0.750061Z\"\n                stroke=\"#B2CBE6\" stroke-width=\"1.5\" stroke-miterlimit=\"10\" />\n              <path d=\"M216.75 212.739C97.4426 212.739 0.75 117.837 0.75 0.738525\" stroke=\"#B2CBE6\" stroke-width=\"1.5\"\n                stroke-miterlimit=\"10\" />\n              <path\n                d=\"M216.17 0.750124C216.17 117.782 119.737 212.63 0.75 212.63C0.750001 95.5984 97.1829 0.750123 216.17 0.750124Z\"\n                stroke=\"#B2CBE6\" stroke-width=\"1.5\" stroke-miterlimit=\"10\" />\n            <\/svg><\/div>\n          <div class=\"about-expertise__text-cont\">\n            <div class=\"about-expertise__title\">\n              <h5>Cinematic Precision,<br />Creatively Driven<\/h5>\n              <p class=\"claim-s\">Everything starts with a brief and a location. From there, we plan the flight\n                paths and camera moves to ensure the perfect aerial shot.<\/p>\n
